<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>

  <style>
    :root {
      color-scheme: light;
      --text: #202124;
      --muted: #666;
      --line: #ddd;
      --link: #1756a9;
      --paper: #fff;
      --soft: #f7f7f7;
    }

    html {
      font-size: 18px;
    }

    body {
      margin: 0;
      color: var(--text);
      background: var(--paper);
      font-family: Georgia, "Times New Roman", serif;
      line-height: 1.65;
    }

    .site-header,
    main,
    .site-footer {
      width: min(900px, calc(100% - 40px));
      margin-left: auto;
      margin-right: auto;
    }

    .site-header {
      padding: 28px 0 18px;
      border-bottom: 1px solid var(--line);
    }

    .site-title {
      color: var(--text);
      font-size: 1.35rem;
      font-weight: 600;
      text-decoration: none;
    }

    .site-description {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    main {
      padding: 42px 0 70px;
    }

    h1, h2, h3 {
      line-height: 1.25;
    }

    h1 {
      font-size: 2.2rem;
      margin-bottom: 0.25rem;
    }

    h2, h3 {
      margin-top: 2.5rem;
    }

    a {
      color: var(--link);
    }

    blockquote {
      margin: 1.5rem 0;
      padding: 0.7rem 1.1rem;
      border-left: 4px solid #bbb;
      background: var(--soft);
    }

    .post-meta {
      color: var(--muted);
      font-size: 0.95rem;
    }

    .post-list {
      padding-left: 0;
      list-style: none;
    }

    .post-list li {
      margin: 1rem 0;
    }

    .post-list time {
      display: block;
      color: var(--muted);
      font-size: 0.9rem;
    }

    mjx-container[display="true"] {
      overflow-x: auto;
      overflow-y: hidden;
      padding: 0.35rem 0;
    }

    .site-footer {
      padding: 24px 0 40px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.9rem;
    }
  </style>

  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['\\(', '\\)'], ['$', '$']],
        displayMath: [['\\[', '\\]'], ['$$', '$$']],
        processEscapes: true
      },
      options: {
        skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
      }
    };
  </script>
  <script
    id="MathJax-script"
    async
    src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js">
  </script>
</head>
<body>
  <header class="site-header">
    <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    {% if site.description %}
      <p class="site-description">{{ site.description }}</p>
    {% endif %}
  </header>

  <main>
    {{ content }}
  </main>

  <footer class="site-footer">
    © {{ site.time | date: "%Y" }} {{ site.title }}
  </footer>
</body>
</html>
